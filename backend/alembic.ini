# A generic, single database configuration.

[alembic]
# path to migration scripts
# Use forward slashes even on Windows
script_location = alembic

# The URL is set programmatically in env.py from our app config,
# so we don't need to duplicate it here.
# sqlalchemy.url is intentionally left blank.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
